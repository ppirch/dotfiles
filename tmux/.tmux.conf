# ~/.tmux.conf — managed by dotfiles (tmux/ package, GNU Stow).
# Reload with: <prefix> R  (or `tmux source-file ~/.tmux.conf`)

# Bind R for reload the config
bind-key R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# Change from C-b to C-a
unbind C-b
set-option -g prefix C-a
unbind-key C-a
bind-key C-a send-prefix
set -g base-index 1 # Set the base index of tmux windows to 1 instead 0

# Set mouse on for dragging and drop
setw -g mouse on

# Bind vim-like key
bind-key v split-window -h # Split the window vertically aligned
bind-key s split-window -v # Split the window horizontally aligned
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Enable vi copy mode
setw -g mode-keys vi

# Copy mode
bind-key [ copy-mode
bind-key ] paste-buffer

# Create new windows and jump
bind-key a last-pane
bind-key q display-panes
bind-key c new-window
bind-key t next-window
bind-key T previous-window

# Set color style since tmux-256color is not available
set-option -g default-terminal screen-256color

# Truecolor (24-bit) passthrough to the outer terminal. Without this, tmux
# quantizes inner apps' RGB colors down to 256 colors on output — Neovim's
# catppuccin looks wrong inside tmux even with termguicolors enabled.
# Matters most where the outer terminal reports plain xterm-256color
# (e.g. browser terminals like ttyd).
set-option -sa terminal-overrides ",xterm*:Tc"


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect' # Resurrect for saving session
set -g @plugin 'tmux-plugins/tmux-cpu' # cpu/ram status modules

# Theme (matches Neovim catppuccin-macchiato). Pinned to a tag for
# reproducible installs; see https://github.com/catppuccin/tmux/tags.
set -g @plugin 'catppuccin/tmux#v2.3.2'
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style 'rounded'
# Short hostname (#h strips the .local domain suffix).
set -g @catppuccin_host_text ' #h'
set -g @catppuccin_date_time_text '%Y-%m-%d %H:%M'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager. NOTE: this must run BEFORE the
# status lines below so the theme defines its modules in time for
# the -F (immediate) expansions.
run '~/.tmux/plugins/tpm/tpm'

set -g status-left-length 100
set -g status-right-length 100
set -g status-left '#{E:@catppuccin_status_session}'
set -g status-right '#{E:@catppuccin_status_host}'
set -agF status-right '#{E:@catppuccin_status_cpu}'
set -agF status-right '#{E:@catppuccin_status_ram}'
set -ag status-right '#{E:@catppuccin_status_date_time}'

# Re-run tmux-cpu interpolation AFTER the status lines above are final:
# its #{cpu_*}/#{ram_*} placeholders only exist once the catppuccin
# modules expand, which happens after TPM loads the plugins.
if-shell '[ -f ~/.tmux/plugins/tmux-cpu/cpu.tmux ]' 'run-shell ~/.tmux/plugins/tmux-cpu/cpu.tmux'
