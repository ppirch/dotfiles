# ~/.tmux.conf — managed by dotfiles (tmux/ package, GNU Stow).
# Reload with: <prefix> R  (or `tmux source-file ~/.tmux.conf`)

# Bind R for reload the config
bind-key R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# Change from C-b to C-a
unbind C-b
set-option -g prefix C-a
unbind-key C-a
bind-key C-a send-prefix
set -g base-index 1 # Set the base index of tmux windows to 1 instead 0

# Set mouse on for dragging and drop
setw -g mouse on

# Bind vim-like key
bind-key v split-window -h # Split the window vertically aligned
bind-key s split-window -v # Split the window horizontally aligned
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Enable vi copy mode
setw -g mode-keys vi

# Copy mode
bind-key [ copy-mode
bind-key ] paste-buffer

# Create new windows and jump
bind-key a last-pane
bind-key q display-panes
bind-key c new-window
bind-key t next-window
bind-key T previous-window

# Set color style since tmux-256color is not available
set-option -g default-terminal screen-256color


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect' # Resurrect for saving session

# Theme
set -g @plugin 'dracula/tmux'
set -g @dracula-show-left-icon session # Show session name on the left
set -g @dracula-plugins "ssh-session cpu-usage gpu-usage ram-usage time"
set -g @dracula-show-timezone false # Dont show timezone
set -g @dracula-time-format "%F %R"
set -g @dracula-cpu-usage-colors "yellow dark_gray"

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
